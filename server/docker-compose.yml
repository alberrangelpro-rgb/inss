# Sobe o servidor de voz JÁ com um endereço HTTPS temporário, de graça e sem
# conta (Cloudflare "quick tunnel"). Depois de subir, veja o endereço com:
#   docker compose logs tunnel
# Procure a linha com https://algo.trycloudflare.com  — é o que vai no app.
services:
  voz:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"          # para testar em http://localhost:8080/saude
    environment:
      # Deixe vazio para testar. Para proteger, defina: TOKEN=uma-senha-longa
      - TOKEN=${TOKEN:-}
      - VOZ_PADRAO=pt_BR-faber-medium
      - MAX_CONCORRENTE=${MAX_CONCORRENTE:-2}
    volumes:
      - ./vozes:/vozes        # modelos de voz (baixados uma vez)
      - ./cache:/cache        # áudios já gerados

  # HTTPS grátis e temporário, sem domínio e sem conta.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://voz:8080
    depends_on:
      - voz
