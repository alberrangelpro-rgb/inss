# Sobe o servidor de voz. Veja o README.md para colocar HTTPS (obrigatório
# para o app, que roda em https). O jeito mais fácil é o Cloudflare Tunnel.
services:
  voz:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Deixe vazio para uso pessoal, ou defina um token para proteger o acesso.
      - TOKEN=${TOKEN:-}
      - VOZ_PADRAO=pt_BR-faber-medium
    volumes:
      - ./vozes:/vozes   # modelos de voz (baixados uma vez)
      - ./cache:/cache   # áudios já gerados

  # HTTPS grátis, sem domínio e sem abrir portas, via Cloudflare Tunnel.
  # 1) crie o túnel no painel da Cloudflare e copie o token;
  # 2) rode:  TUNNEL_TOKEN=xxxxx docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - voz
